name: cVidya Networks
description: >-
  cVidya Networks was a provider of big-data analytics software for communications and digital
  service providers, best known for its MoneyMap product suite covering revenue assurance, fraud
  management, marketing analytics, and data monetization for telecom operators. Founded in 2000 by
  Alon Aginsky as an Israeli/US company, cVidya grew to roughly 300 employees and about $65M in
  revenue with deployments across Europe, LATAM, APAC, North America, and Africa. In January 2016
  the company was acquired by Amdocs (reported at ~$30M) and absorbed into the Amdocs Revenue Guard
  and Business Assurance offering; cVidya no longer operates as an independent company and its
  cvidya.com domain no longer resolves. This profile is retained in the API Evangelist network as a
  historical company record; there is no live developer portal or public API surface to enrich.
